name: Mantener Supabase despierta

# Supabase (plan gratis) pausa el proyecto tras ~7 días sin actividad.
# Este "ping" consulta la base cada 2 días para que nunca se duerma.
# No usa secretos: la apikey de abajo es la clave ANÓNIMA pública (la misma
# que ya viaja en el sitio, en assets/egs.js). No da acceso a datos privados:
# la tabla de envíos solo permite insertar, no leer.

on:
  schedule:
    - cron: '17 8 */2 * *'   # cada 2 días, 08:17 UTC (margen amplio antes de los 7 días)
  workflow_dispatch:          # permite correrlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la API de Supabase
        run: |
          BASE="https://eicedyftposrsohlgzrl.supabase.co"
          KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVpY2VkeWZ0cG9zcnNvaGxnenJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2NTAwMzcsImV4cCI6MjA5ODIyNjAzN30.h01a4OF66LS71FEWyjOx0BqaiQwClNdmwlQtsZMD54w"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "$BASE/rest/v1/historias_publicas?select=created_at&limit=1" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY")
          echo "Respuesta de Supabase: HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "Aviso: la base no respondió 200 (puede estar pausada o reactivándose)."
            exit 1
          fi
          echo "OK: base despierta."
