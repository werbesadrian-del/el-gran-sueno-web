# El Gran Sueño — build MÍNIMO (node build.js, sin dependencias → ~1-2 s, casi cero crédito).
# build.js convierte los posts del panel (content/*.json) en páginas estáticas fuertes
# para Google (/blog/<slug>, /huella/<slug>) y regenera el sitemap. El resto se publica igual.
[build]
  publish = "."
  command = "node build.js"

[[redirects]]
  from = "/blog-articulo.html"
  to   = "/escrito-identidad-dios-ya-dijo"
  status = 301

[[redirects]]
  from = "/huella-individual.html"
  to   = "/huella-george-muller"
  status = 301
