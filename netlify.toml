# El Gran Sueño — build.
# og-card.mjs genera las tarjetas sociales (1200x630, el hero de cada escrito/huella) con
# satori, SIN navegador, así se crean solas al publicar desde donde sea (panel, celular).
# build.js convierte los posts del panel (content/*.json) en páginas estáticas fuertes
# para Google (/blog/<slug>, /huella/<slug>) y regenera el sitemap.
[build]
  publish = "."
  command = "node og-card.mjs && node build.js"

[build.environment]
  NODE_VERSION = "20"

# Caché estable para las imágenes de previsualización (Open Graph): la imagen se genera
# idéntica en cada build, así que Facebook/WhatsApp la pueden guardar sin re-validar a cada rato.
[[headers]]
  for = "/assets/og/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/og-default.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# La Tierra (texturas NASA) no cambia entre publicaciones: el navegador la guarda un mes
# y no vuelve a preguntar en cada visita. Si algún día se cambia una textura, cambiarle el nombre.
[[headers]]
  for = "/assets/tierra/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[redirects]]
  from = "/blog-articulo.html"
  to   = "/escrito-identidad-dios-ya-dijo"
  status = 301

[[redirects]]
  from = "/huella-individual.html"
  to   = "/huella-george-muller"
  status = 301
